<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resenha Buteco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Caveat:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon-deep:#6E1423;
    --maroon-dark:#4A0D18;
    --bg-black:#180405;
    --gold:#F0B429;
    --gold-deep:#C4880F;
    --cream:#F7ECD9;
    --charcoal:#211712;
    --line: rgba(240,180,41,0.35);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg-black:#180405;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 120% 60% at 50% 0%, var(--maroon-dark) 0%, var(--bg-black) 55%),
      var(--bg-black);
    color:var(--cream);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .page{
    width:100%;
    max-width:480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
    z-index:2;
    overflow-x:hidden;
  }

  /* HERO */
  .hero{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    overflow:hidden;
  }
  .hero img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    animation:slowZoom 18s ease-in-out infinite alternate;
  }
  @keyframes slowZoom{
    from{ transform:scale(1); }
    to{ transform:scale(1.08); }
  }
  @media (prefers-reduced-motion: reduce){
    .hero img{ animation:none; }
  }
  .hero::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg,
      rgba(24,4,5,0) 0%,
      rgba(24,4,5,0) 25%,
      rgba(35,7,9,0.55) 55%,
      var(--bg-black) 100%);
  }

  /* HEADER TEXT BELOW HERO */
  .identity{
    margin-top:-70px;
    z-index:2;
    text-align:center;
    padding:0 28px;
  }
  .kicker{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:1.5rem;
    color:var(--gold);
    letter-spacing:0.02em;
    line-height:1;
    margin:0 0 2px;
  }
  h1{
    margin:0;
    line-height:0.92;
  }
  h1 .l1{
    display:block;
    font-family:'Titan One', sans-serif;
    font-weight:400;
    font-size:2.4rem;
    letter-spacing:0.01em;
    color:var(--cream);
    text-shadow:0 3px 0 var(--charcoal), 0 3px 10px rgba(0,0,0,0.35);
  }
  h1 .l2{
    display:block;
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:3.1rem;
    color:var(--gold);
    line-height:0.85;
    margin-top:2px;
    transform:rotate(-3deg);
    text-shadow:0 2px 0 rgba(33,23,18,0.5);
  }
  .tagline-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top:12px;
    color:var(--gold);
    opacity:0.9;
  }
  .tagline-row .rule{
    height:1px;
    width:26px;
    background:var(--line);
  }
  .tagline-row svg{
    width:12px;
    height:12px;
    fill:var(--gold);
    opacity:0.85;
  }
  .tagline-row span.txt{
    font-size:0.78rem;
    letter-spacing:0.14em;
    font-weight:600;
  }

  /* LINKS BLOCK */
  .links{
    width:100%;
    max-width:400px;
    padding:34px 24px 20px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .btn{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 20px;
    text-decoration:none;
    border-radius:10px;
    font-family:'Work Sans', sans-serif;
    transition:transform 0.15s ease;
  }
  .btn:active{ transform:scale(0.98); }

  .btn-icon{
    width:40px;
    height:40px;
    flex:0 0 40px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
  }
  .btn-icon svg{ width:22px; height:22px; }

  .btn-text{ display:flex; flex-direction:column; gap:1px; }
  .btn-title{ font-weight:700; font-size:1.02rem; }
  .btn-sub{ font-size:0.78rem; opacity:0.75; font-weight:500; }

  .btn-primary{
    background:linear-gradient(180deg, var(--gold) 0%, var(--gold-deep) 100%);
    color:var(--charcoal);
    border:2px solid var(--charcoal);
    box-shadow:0 3px 0 var(--charcoal);
  }
  .btn-primary .btn-icon{ background:var(--charcoal); }
  .btn-primary .btn-icon svg{ fill:var(--gold); }
  .btn-primary .btn-sub{ color:var(--charcoal); opacity:0.65; }

  .btn-outline{
    background:rgba(240,236,217,0.04);
    color:var(--cream);
    border:1.5px solid var(--line);
  }
  .btn-outline .btn-icon{ background:rgba(240,180,41,0.12); }
  .btn-outline .btn-icon svg{ fill:var(--gold); }

  .btn-arrow{
    margin-left:auto;
    opacity:0.5;
    flex:0 0 auto;
  }

  /* DIVIDER ornament like the logo's small tick lines */
  .ornament{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin:6px 0 4px;
    opacity:0.55;
  }
  .ornament .tick{
    width:16px;
    height:2px;
    background:var(--gold);
  }
  .ornament svg{ width:16px; height:16px; }

  footer{
    margin-top:auto;
    padding:22px 24px 34px;
    text-align:center;
  }
  footer .since{
    font-size:0.72rem;
    letter-spacing:0.12em;
    color:var(--gold);
    opacity:0.7;
    font-weight:600;
  }

    0%, 100%{ box-shadow:0 3px 0 var(--charcoal), 0 0 0 rgba(240,180,41,0.0); }
    50%{ box-shadow:0 3px 0 var(--charcoal), 0 0 22px rgba(240,180,41,0.45); }
  }

  .btn::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    background:linear-gradient(115deg, transparent 40%, rgba(255,255,255,0.16) 50%, transparent 60%);
    background-size:220% 220%;
    background-position:120% 0;
    opacity:0;
    transition:opacity 0.2s ease;
    pointer-events:none;
  }
  .btn:hover::after{
    opacity:1;
    animation:sheen 0.9s ease forwards;
  }
  @keyframes sheen{
    from{ background-position:120% 0; }
    to{ background-position:-20% 0; }
  }

  .identity, .links{
    animation:riseIn 0.7s cubic-bezier(0.16,1,0.3,1) both;
  }
  .links{ animation-delay:0.08s; }
  @keyframes riseIn{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .bubbles{ display:none; }

  /* ambient breathing light behind everything */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:radial-gradient(circle at 30% 20%, rgba(240,180,41,0.14), transparent 45%),
               radial-gradient(circle at 75% 75%, rgba(110,20,35,0.35), transparent 55%);
    background-size:180% 180%;
    animation:ambientDrift 14s ease-in-out infinite alternate;
  }
  @keyframes ambientDrift{
    from{ background-position:0% 0%, 100% 100%; }
    to{ background-position:20% 15%, 80% 85%; }
  }

  /* neon-sign style flicker on the small kicker line */
  .kicker{ animation:neonFlicker 6s linear infinite; }
  @keyframes neonFlicker{
    0%, 3%, 6%, 100%{ opacity:1; text-shadow:0 0 8px rgba(240,180,41,0.55); }
    4%{ opacity:0.4; text-shadow:none; }
    5%{ opacity:0.9; text-shadow:0 0 8px rgba(240,180,41,0.4); }
    47%, 50%{ opacity:1; text-shadow:0 0 8px rgba(240,180,41,0.55); }
    48%{ opacity:0.5; text-shadow:none; }
  }

  /* twinkling stars beside DESDE 2017 */
  .tagline-row svg{ animation:twinkle 2.4s ease-in-out infinite; }
  .tagline-row svg:last-of-type{ animation-delay:1.1s; }
  @keyframes twinkle{
    0%, 100%{ opacity:0.5; transform:scale(0.9); }
    50%{ opacity:1; transform:scale(1.15); }
  }

  @media (prefers-reduced-motion: reduce){
    .btn{ transition:none; }
    .btn-primary{ animation:none; }
    .btn:hover::after{ animation:none; opacity:0; }
    .identity, .links{ animation:none; }
    body::before{ animation:none; }
    .kicker{ animation:none; }
    .tagline-row svg{ animation:none; }
  }
</style>
